name: Documentation

on:
  push:
    branches: [viscript]
    paths:
      - 'docs/**'
      - 'scripts/*page*.mjs'
      - 'tools/skill/vis-skills/references/**'
      - 'tools/skill/vis-skills/assets/wasm/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/*page*.mjs'
      - 'tools/skill/vis-skills/references/**'
      - 'tools/skill/vis-skills/assets/wasm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Compile MDX pages
        run: npm ci --prefix docs/page && node scripts/build-page.mjs
      - name: Verify documentation scenes and runtime
        run: npm run check --prefix docs/page
      - name: Drop build tooling from the site
        run: rm -rf docs/page/node_modules
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/page

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/viscript'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
