<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="viscript: scenes and animation written in Lua or JavaScript, sampled at any frame.">
  <title>viscript</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/codemirror.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="api-graph.css">
  <link rel="stylesheet" href="build/api/static/viscript/viewer.css">
  <script src="vendor/codemirror.js" defer></script>
  <script src="vendor/lua.js" defer></script>
  <script src="vendor/javascript.js" defer></script>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("viscript-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
    catch { /* keep dark */ }
    // Home and Examples open on a live figure: fetch its runtime and default fonts alongside
    // the page instead of after the module graph (player.js consumes these).
    if (/^(#\/?)?(examples(\/.*)?)?$/.test(location.hash)) {
      for (const href of ["runtime/vis-wasm.wasm", "runtime/PretendardStd-Regular.ttf", "runtime/JetBrainsMono.ttf"]) {
        document.head.append(Object.assign(document.createElement("link"), {rel: "preload", as: "fetch", crossOrigin: "anonymous", href}));
      }
    }
  </script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><img src="favicon.svg" alt="" width="22" height="22">viscript</a>
  <nav aria-label="Main">
    <a href="#/" data-route="home">Home</a>
    <a href="#/docs" data-route="docs">Docs</a>
    <a href="#/api" data-route="api">API</a>
    <a href="#/examples" data-route="examples">Examples</a>
  </nav>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light / dark">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<main id="app"></main>
<script type="module" src="app.js"></script>
</body>
</html>
