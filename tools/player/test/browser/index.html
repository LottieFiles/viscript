<!doctype html>
<meta charset="utf-8">
<title>Player end-to-end</title>
<style>
  body { margin: 0; background: #808080; }
  .stage { width: 480px; }
  .spacer { height: 4000px; }
</style>
<div id="a" class="stage"></div>
<div id="b" class="stage"></div>
<div class="spacer"></div>
<div id="far" class="stage"></div>
<script type="module">
  // Plays the documentation's scenes with the built player, as a page would; run.mjs drives it.
  import {chainFonts, createCatalog, createRenderHost, createSandboxCompiler, fontTable, runtimeFonts, VisPlayer} from "/tools/player/dist/player.js";
  import {HERO} from "/docs/page/scenes/hero.js";
  import {INTERACTIVE} from "/docs/page/scenes/interactive.js";

  const params = new URLSearchParams(location.search);
  const runtime = "/tools/skill/vis-skills/assets/wasm/";
  // The fonts, by name, as the documentation gives them; fontsAsked lists the names the render
  // worker asked for, in order.
  const fonts = chainFonts(fontTable({Pretendard: "/src/examples/assets/PretendardStd-Regular.ttf"}), runtimeFonts(runtime));
  const fontsAsked = [];
  // ?sandbox compiles JavaScript scenes in the sandbox, which stops them after ?compile milliseconds.
  const compiler = params.has("sandbox") ? createSandboxCompiler({
    code: await fetch("/tools/player/dist/player-compiler.js").then((response) => response.text()),
    timeout: Number(params.get("compile") ?? 10000),
  }) : undefined;
  // A second of a 440 Hz tone as 16-bit mono WAV, for scenes with sound.
  function tone(rate = 8000) {
    const samples = rate, view = new DataView(new ArrayBuffer(44 + samples * 2));
    const text = (at, value) => [...value].forEach((char, i) => view.setUint8(at + i, char.charCodeAt(0)));
    text(0, "RIFF"); view.setUint32(4, 36 + samples * 2, true); text(8, "WAVEfmt ");
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    text(36, "data"); view.setUint32(40, samples * 2, true);
    for (let i = 0; i < samples; i++) view.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / rate) * 8000, true);
    return view.buffer;
  }
  const catalog = createCatalog({
    assets: {"tone.wav": {mime: "audio/wav", load: async () => tone()}},
    select: (source) => source.includes("tone.wav") ? ["tone.wav"] : [],
  });
  const host = createRenderHost({
    server: {url: "/tools/player/dist/player-worker.js"},
    wasm: () => fetch(runtime + "vis-wasm.wasm").then((response) => response.arrayBuffer()),
    fonts: {fetch: (name, options) => (fontsAsked.push(name), fonts.fetch(name, options))},
    assets: catalog,
    mode: params.get("mode") ?? "auto",
    hangTimeout: Number(params.get("hang") ?? 10000),
    ...compiler ? {compiler} : {},
  });
  const events = [];
  const players = {};
  const scenes = {HERO, PATH: INTERACTIVE.episodes.find((episode) => episode.id === "shortest-path").code};
  window.e2e = {
    host, events, players, scenes, fontsAsked,
    make(id, scene, options = {}) {
      const player = new VisPlayer({host, container: document.getElementById(id), label: id,
        resources: (source, language) => catalog.resources(source, language), ...options});
      for (const type of ["load", "play", "pause", "stop", "freeze", "complete", "loop", "error", "destroyed"]) {
        player.addEventListener(type, (event) => events.push(`${id} ${type}${event.detail?.phase ? ` ${event.detail.phase}` : ""}`));
      }
      player.addEventListener("statechange", (event) => events.push(`${id} ${event.detail.state}`));
      players[id] = player;
      void player.load(scene);
      return player.state;
    },
  };
</script>
